packages:
  - apps/*
  - packages/*

# Flat node_modules (like npm). Hostinger copies the built app into a release folder
# without keeping pnpm's symlinks, which breaks package resolution (e.g. next -> styled-jsx).
nodeLinker: hoisted

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
